version: '3'

services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5434:5432"
    env_file:             
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: politutorias-db
    volumes:
      - ./postgres:/var/lib/postgresql/data
