# GitHub Actions Workflow: Backend NestJS → AWS Elastic Beanstalk
# Migrado desde Azure Pipelines
#
# Flujo de ramas (Git Flow):
#   1. feature/* → PR a develop → merge dispara deploy a STAGING
#   2. develop   → PR a main    → merge dispara deploy a PRODUCTION
#   Nadie hace push directo a develop ni main (ramas protegidas).
#   El evento "push" se dispara automáticamente cuando un PR es mergeado.

name: Deploy Backend to AWS EB

on:
  # Se dispara cuando un PR es mergeado (el merge genera un push en la rama destino)
  push:
    branches:
      - main
      - develop
  # Se dispara cuando se abre/actualiza un PR → solo ejecuta CI (build + test), NO deploy
  pull_request:
    branches:
      - develop
      - main

env:
  NODE_VERSION: "22.x"
  AWS_REGION: "us-east-1"
  AWS_BUCKET_NAME: "politutorias-storage-prod"
  EB_APP_NAME: "politutorias-backend"
  EB_ENV_STAGING: "politutorias-backend-staging"
  EB_ENV_PROD: "politutorias-backend-prod"

jobs:
  # ==========================================
  # JOB 1: BUILD & TEST (CI)
  # ==========================================
  build:
    name: "1. Build & Test API (CI)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Instalar dependencias"
        run: yarn install --frozen-lockfile

      - name: "Ejecutar Linter"
        run: yarn lint

      - name: "Tests y Cobertura"
        run: yarn test:cov

      - name: "Compilar NestJS"
        run: |
          echo "Limpiando build previo..."
          rm -rf dist
          yarn build

      - name: "Preparar Paquete de Despliegue"
        run: |
          echo "Preparando carpeta de despliegue limpia..."
          mkdir -p deployment_package

          # Copiar archivos básicos (estos suelen ser obligatorios)
          cp package.json deployment_package/ || echo "package.json no encontrado"
          cp yarn.lock deployment_package/ || echo "yarn.lock no encontrado"

          # Copiar el build compilado (dist/)
          if [ -d "dist" ]; then
            cp -r dist deployment_package/
            echo "[OK] dist/ copiado."
          else
            echo "[ERROR] dist/ no encontrado. Fallo yarn build?"
            exit 1
          fi

          # Copiar configuraciones de AWS solo SI existen
          if [ -d ".ebextensions" ]; then
            cp -r .ebextensions deployment_package/
            echo "[OK] .ebextensions copiado."
          else
            echo "[WARN] .ebextensions no encontrado, saltando..."
          fi

          if [ -f "Procfile" ]; then
            cp Procfile deployment_package/
            echo "[OK] Procfile copiado."
          else
            echo "[WARN] Procfile no encontrado, saltando..."
          fi

          # Instalar dependencias
          cd deployment_package
          yarn install --production --frozen-lockfile

      - name: "Crear ZIP Final"
        run: |
          cd deployment_package
          zip -r ../deployment.zip .

      - name: "Subir Artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: backend-api
          path: deployment.zip
          retention-days: 1

  # ==========================================
  # JOB 2: DEPLOY A STAGING (CD - develop)
  # ==========================================
  deploy-staging:
    name: "2. Deploy to Staging (AWS)"
    runs-on: ubuntu-latest
    needs: build
    # Solo despliega en push a develop (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: Staging
      url: http://politutorias-backend-staging.eba-qnyktbf8.us-east-1.elasticbeanstalk.com

    steps:
      - name: "Descargar Artefacto"
        uses: actions/download-artifact@v4
        with:
          name: backend-api
          path: .

      - name: "Instalar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Instalar AWS CLI y EB CLI"
        run: |
          echo "Installing AWS CLI and EB CLI..."
          sudo apt-get update -qq
          sudo apt-get install -y pipx unzip curl postgresql-client

          # Install AWS CLI v2
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

          # Install EB CLI
          pipx install awsebcli
          pipx ensurepath

          # Verify installations
          aws --version
          eb --version

      - name: "Verificar/Crear BD Staging"
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PGSSLMODE: require
          DB_NAME_STAGING: politutorias_staging
        run: |
          echo "[INFO] Verificando conectividad con RDS..."

          # Paso 1: Verificar que podemos conectarnos al RDS
          if ! PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d postgres \
            -c "SELECT 1" > /dev/null 2>&1; then
            echo "[ERROR] No se pudo conectar al servidor RDS en $DB_HOST:$DB_PORT"
            echo "[ERROR] Verifica que el Security Group del RDS permita conexiones desde GitHub Actions."
            echo "[ERROR] El deploy continuará, pero la BD podría no existir."
            exit 1
          fi
          echo "[OK] Conexión a RDS establecida."

          # Paso 2: Verificar si la BD existe
          echo "[INFO] Verificando si la base de datos '$DB_NAME_STAGING' existe..."
          DB_EXISTS=$(PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d postgres \
            -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME_STAGING'")

          if [ "$DB_EXISTS" = "1" ]; then
            echo "[OK] Base de datos '$DB_NAME_STAGING' ya existe."
          else
            echo "[WARN] Base de datos '$DB_NAME_STAGING' no encontrada. Creando..."
            PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d postgres \
              -c "CREATE DATABASE $DB_NAME_STAGING"

            # Verificar que se creó correctamente
            DB_VERIFY=$(PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d postgres \
              -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME_STAGING'")

            if [ "$DB_VERIFY" = "1" ]; then
              echo "[OK] Base de datos '$DB_NAME_STAGING' creada y verificada exitosamente."
            else
              echo "[ERROR] No se pudo crear la base de datos '$DB_NAME_STAGING'."
              exit 1
            fi
          fi

      - name: "Deploy a Elastic Beanstalk Staging"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          export PATH=$PATH:$HOME/.local/bin:/opt/pipx_bin

          # Configurar AWS credentials
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_DEFAULT_REGION"

          # Extraer el paquete
          mkdir deploy_staging
          unzip deployment.zip -d deploy_staging
          cd deploy_staging

          # Debug: Verificar estructura del paquete
          echo "--- Contenido del Paquete ---"
          ls -la
          echo "--- Carpeta dist ---"
          ls -la dist/ || echo "[WARN] dist/ no encontrado en el paquete"
          echo "--- Procfile ---"
          cat Procfile || echo "[WARN] Procfile no encontrado"
          echo "-----------------------------"

          # Inicializar EB application
          eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"

          # Desplegar a staging
          eb deploy ${{ env.EB_ENV_STAGING }} --label "ver-${{ github.run_number }}" --timeout 20

      - name: "Ejecutar Seed Staging"
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: politutorias_staging
        run: |
          echo "[INFO] Ejecutando seed en staging..."

          # Usar el paquete ya extraido en deploy_staging
          cd deploy_staging

          # Ejecutar seed
          node dist/database/seed.js

          echo "[OK] Seed ejecutado exitosamente en staging"

      - name: "Health Check Post-Deploy"
        run: |
          echo "[INFO] Esperando 30s para que el servidor arranque..."
          sleep 30

          STAGING_URL="http://${{ env.EB_ENV_STAGING }}.eba-qnyktbf8.${{ env.AWS_REGION }}.elasticbeanstalk.com"

          echo "[INFO] Verificando health del backend en $STAGING_URL..."

          # Verificar endpoint básico
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/" --max-time 15 || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[OK] Endpoint raíz respondió 200."
          else
            echo "[WARN] Endpoint raíz respondió $HTTP_CODE."
          fi

          # Verificar endpoint de API que requiere BD
          HTTP_CODE_API=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/ofertas/search?page=1&limit=1" --max-time 15 || echo "000")
          if [ "$HTTP_CODE_API" = "200" ]; then
            echo "[OK] API /api/ofertas/search respondió 200 - BD conectada correctamente."
          else
            echo "[ERROR] API /api/ofertas/search respondió $HTTP_CODE_API"
            echo "[ERROR] El backend puede estar activo pero SIN conexión a la BD."
            echo "[ERROR] Verifica las variables de entorno DB_NAME, DB_HOST, DB_USER en Elastic Beanstalk."
            exit 1
          fi

          echo "[OK] Health check completado exitosamente."

  # ==========================================
  # JOB 3: DEPLOY A PRODUCCIÓN (CD - main)
  # ==========================================
  deploy-production:
    name: "3. Deploy to Production (AWS)"
    runs-on: ubuntu-latest
    needs: build
    # Solo despliega en push a main (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: Production
      url: http://politutorias-backend-prod.eba-qnyktbf8.us-east-1.elasticbeanstalk.com

    steps:
      - name: "Descargar Artefacto"
        uses: actions/download-artifact@v4
        with:
          name: backend-api
          path: .

      - name: "Instalar AWS CLI y EB CLI"
        run: |
          echo "Installing AWS CLI and EB CLI..."
          sudo apt-get update -qq
          sudo apt-get install -y pipx unzip curl postgresql-client

          # Install AWS CLI v2
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

          # Install EB CLI
          pipx install awsebcli
          pipx ensurepath

          # Verify installations
          aws --version
          eb --version

      - name: "Verificar/Crear BD Production"
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PGSSLMODE: require
          DB_NAME_PROD: politutorias_prod
        run: |
          echo "[INFO] Verificando conectividad con RDS..."

          # Paso 1: Verificar que podemos conectarnos al RDS
          if ! PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d postgres \
            -c "SELECT 1" > /dev/null 2>&1; then
            echo "[ERROR] No se pudo conectar al servidor RDS en $DB_HOST:$DB_PORT"
            echo "[ERROR] Verifica que el Security Group del RDS permita conexiones desde GitHub Actions."
            exit 1
          fi
          echo "[OK] Conexión a RDS establecida."

          # Paso 2: Verificar si la BD existe
          echo "[INFO] Verificando si la base de datos '$DB_NAME_PROD' existe..."
          DB_EXISTS=$(PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d postgres \
            -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME_PROD'")

          if [ "$DB_EXISTS" = "1" ]; then
            echo "[OK] Base de datos '$DB_NAME_PROD' ya existe."
          else
            echo "[WARN] Base de datos '$DB_NAME_PROD' no encontrada. Creando..."
            PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d postgres \
              -c "CREATE DATABASE $DB_NAME_PROD"

            # Verificar que se creó correctamente
            DB_VERIFY=$(PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d postgres \
              -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME_PROD'")

            if [ "$DB_VERIFY" = "1" ]; then
              echo "[OK] Base de datos '$DB_NAME_PROD' creada y verificada exitosamente."
            else
              echo "[ERROR] No se pudo crear la base de datos '$DB_NAME_PROD'."
              exit 1
            fi
          fi

      - name: "Deploy a Elastic Beanstalk Production"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          export PATH=$PATH:$HOME/.local/bin:/opt/pipx_bin

          # Configurar AWS credentials
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_DEFAULT_REGION"

          # Extraer el paquete
          mkdir deploy_production
          unzip deployment.zip -d deploy_production
          cd deploy_production

          # Debug: Verificar estructura del paquete
          echo "--- Contenido del Paquete ---"
          ls -la
          echo "--- Carpeta dist ---"
          ls -la dist/ || echo "[WARN] dist/ no encontrado en el paquete"
          echo "--- Procfile ---"
          cat Procfile || echo "[WARN] Procfile no encontrado"
          echo "-----------------------------"

          # Inicializar EB application
          eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"

          # Desplegar a producción
          eb deploy ${{ env.EB_ENV_PROD }} --label "ver-${{ github.run_number }}" --timeout 20

      - name: "Health Check Post-Deploy"
        run: |
          echo "[INFO] Esperando 30s para que el servidor arranque..."
          sleep 30

          PROD_URL="http://${{ env.EB_ENV_PROD }}.eba-qnyktbf8.${{ env.AWS_REGION }}.elasticbeanstalk.com"

          echo "[INFO] Verificando health del backend en $PROD_URL..."

          # Verificar endpoint básico
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/" --max-time 15 || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[OK] Endpoint raíz respondió 200."
          else
            echo "[WARN] Endpoint raíz respondió $HTTP_CODE."
          fi

          # Verificar endpoint de API que requiere BD
          HTTP_CODE_API=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/ofertas/search?page=1&limit=1" --max-time 15 || echo "000")
          if [ "$HTTP_CODE_API" = "200" ]; then
            echo "[OK] API /api/ofertas/search respondió 200 - BD conectada correctamente."
          else
            echo "[ERROR] API /api/ofertas/search respondió $HTTP_CODE_API"
            echo "[ERROR] El backend puede estar activo pero SIN conexión a la BD."
            echo "[ERROR] Verifica las variables de entorno DB_NAME, DB_HOST, DB_USER en Elastic Beanstalk."
            exit 1
          fi

          echo "[OK] Health check completado exitosamente."

